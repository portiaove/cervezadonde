name: Deploy

# Deploys CODE (web build + API) to the VPS on every push to main.
# Data is NOT deployed here — it flows PC -> VPS via scripts/push-data.ps1.
# Requires two repo secrets:
#   DEPLOY_SSH_KEY  — private key whose public half is in the VPS authorized_keys
#   DEPLOY_HOST     — the VPS IP or hostname
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm typecheck

      # Uses .env.production -> VITE_API_URL=/api (same-origin via Caddy).
      - run: pnpm --filter @cervezadonde/web build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload web build
        run: |
          HOST="root@${{ secrets.DEPLOY_HOST }}"
          # Keep old hashed chunks for cached pages and already-open tabs.
          # Upload dependencies first, then atomically publish the new index.
          ssh -i ~/.ssh/id_ed25519 "$HOST" 'mkdir -p /root/cervezadonde/deploy/web-dist/assets'
          scp -i ~/.ssh/id_ed25519 -r apps/web/dist/assets/. "$HOST":/root/cervezadonde/deploy/web-dist/assets/
          scp -i ~/.ssh/id_ed25519 apps/web/dist/favicon.svg "$HOST":/root/cervezadonde/deploy/web-dist/favicon.svg
          scp -i ~/.ssh/id_ed25519 apps/web/dist/index.html "$HOST":/root/cervezadonde/deploy/web-dist/index.html.next
          ssh -i ~/.ssh/id_ed25519 "$HOST" 'mv /root/cervezadonde/deploy/web-dist/index.html.next /root/cervezadonde/deploy/web-dist/index.html'

      - name: Pull code, migrate/refine data, then replace API
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@${{ secrets.DEPLOY_HOST }}" '
            cd /root/cervezadonde &&
            git pull --ff-only &&
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
              build api &&
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
              run --rm -T api pnpm --filter @cervezadonde/db migrate up &&
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
              run --rm -T api pnpm --filter @cervezadonde/worker refine:censo-matches &&
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
              up -d
          '

      # git pull can replace the Caddyfile inode. A reload in the old container
      # then reads the stale file bind mount, so recreate to bind the new file.
      - name: Recreate Caddy with the current config
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@${{ secrets.DEPLOY_HOST }}" '
            cd /root/cervezadonde &&
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
              up -d --no-deps --force-recreate caddy
          '
